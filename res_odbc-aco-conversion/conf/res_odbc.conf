; res_odbc.conf — comprehensive parser-coverage fixture
;
; This config is the input to the config_options-migration golden test.
; It is INTENTIONALLY exhaustive and contains many bogus/edge-case values
; that produce WARNINGs at parse time. Those WARNINGs are part of the
; observable parser contract — the snapshot diff captures them and the
; migrated implementation MUST emit the same set (modulo deliberately
; documented changes).
;
; Sections are grouped by what they exercise.

;-------------------------------------------------------------------
; [ENV] — every name/value pair becomes an environment variable.
;-------------------------------------------------------------------
[ENV]
ODBC_GOLDEN_VAR_A=hello
ODBC_GOLDEN_VAR_B=world with spaces

;-------------------------------------------------------------------
; All options set with valid values — the most-coverage class.
;-------------------------------------------------------------------
[golden_allopts]
enabled => yes
dsn => golden-pg
username => asterisk
password => asterisk
sanitysql => SELECT 1
pre-connect => yes
backslash_is_escape => no
connect_timeout => 7
negative_connection_cache => 1.5
forcecommit => yes
isolation => repeatable_read
max_connections => 5
logging => yes
slow_query_limit => 1234
cache_type => queue
cache_size => 25

;-------------------------------------------------------------------
; Minimum — only dsn set, everything else defaults. Used to lock down
; the default values of every field.
;-------------------------------------------------------------------
[golden_minimal]
dsn => golden-pg

;-------------------------------------------------------------------
; enabled => no — class is parsed but skipped (no Registered NOTICE).
;-------------------------------------------------------------------
[golden_disabled]
dsn => golden-pg
enabled => no

;-------------------------------------------------------------------
; enabled defaults to yes but dsn is missing — also skipped, silently.
;-------------------------------------------------------------------
[golden_no_dsn]
username => orphan
sanitysql => SELECT 1

;-------------------------------------------------------------------
; isolation: every accepted value, including the loose-prefix matching
; that ast_odbc_text2isolation() does. The migration must explicitly
; choose to preserve or break each of these. The snapshot will show
; which behavior wins.
;
; Notes on the legacy parser (res/res_odbc.c:152-169):
;   - "read_" + 'c'-anything   → SQL_TXN_READ_COMMITTED   (case-insensitive)
;   - "read_" + 'u'-anything   → SQL_TXN_READ_UNCOMMITTED
;   - anything starting "ser"  → SQL_TXN_SERIALIZABLE     (e.g. "serpent")
;   - anything starting "rep"  → SQL_TXN_REPEATABLE_READ  (e.g. "reptile")
;   - anything else            → 0 → ERROR + default to READ_COMMITTED
;-------------------------------------------------------------------
[golden_iso_rc]
dsn => golden-pg
isolation => read_committed

[golden_iso_ru]
dsn => golden-pg
isolation => read_uncommitted

[golden_iso_ser]
dsn => golden-pg
isolation => serializable

[golden_iso_rep]
dsn => golden-pg
isolation => repeatable_read

[golden_iso_caseinsensitive]
dsn => golden-pg
isolation => READ_C

[golden_iso_loose_serpent]
dsn => golden-pg
isolation => serpent

[golden_iso_loose_reptile]
dsn => golden-pg
isolation => reptile

[golden_iso_loose_read_zebra]
dsn => golden-pg
; "read_" + 'z' — not 'c' or 'u' → 0 → ERROR + reset to read_committed
isolation => read_zebra

[golden_iso_garbage]
dsn => golden-pg
isolation => totally_bogus

;-------------------------------------------------------------------
; cache_type: only "rr" / "roundrobin" / "queue" map to the
; round-robin queue. Anything else (including "stack") silently maps
; to stack semantics (cache_is_queue=0). No warning is emitted for
; bogus values — interesting parser quirk to preserve or fix.
;-------------------------------------------------------------------
[golden_cache_rr]
dsn => golden-pg
cache_type => rr

[golden_cache_roundrobin]
dsn => golden-pg
cache_type => roundrobin

[golden_cache_queue]
dsn => golden-pg
cache_type => queue

[golden_cache_stack]
dsn => golden-pg
cache_type => stack

[golden_cache_bogus]
dsn => golden-pg
cache_type => totally_bogus

;-------------------------------------------------------------------
; cache_size: "-1" is a SPECIAL CASE → UINT_MAX (uncapped). sscanf %u
; on "garbage" silently fails leaving max_cache_size at its default
; (UINT_MAX from the per-section reset block) — same as -1 in effect,
; but a WARNING is emitted for parse failure.
;-------------------------------------------------------------------
[golden_cache_size_minus1]
dsn => golden-pg
cache_size => -1

[golden_cache_size_zero]
dsn => golden-pg
cache_size => 0

[golden_cache_size_pos]
dsn => golden-pg
cache_size => 42

[golden_cache_size_garbage]
dsn => golden-pg
cache_size => not_a_number

;-------------------------------------------------------------------
; max_connections: must be >= 1. 0 / negative / non-numeric → WARN
; + reset to 1.
;-------------------------------------------------------------------
[golden_maxconn_zero]
dsn => golden-pg
max_connections => 0

[golden_maxconn_neg]
dsn => golden-pg
max_connections => -5

[golden_maxconn_garbage]
dsn => golden-pg
max_connections => foo

[golden_maxconn_huge]
dsn => golden-pg
max_connections => 2147483647

;-------------------------------------------------------------------
; connect_timeout: must be >= 1. <1 / non-numeric → WARN + reset to 10.
;-------------------------------------------------------------------
[golden_conntimeout_zero]
dsn => golden-pg
connect_timeout => 0

[golden_conntimeout_garbage]
dsn => golden-pg
connect_timeout => foo

;-------------------------------------------------------------------
; negative_connection_cache: parsed as double seconds, must be >= 0.
; Negative / non-numeric → WARN + default 300s.
;-------------------------------------------------------------------
[golden_negcache_zero]
dsn => golden-pg
negative_connection_cache => 0

[golden_negcache_fractional]
dsn => golden-pg
negative_connection_cache => 2.75

[golden_negcache_neg]
dsn => golden-pg
negative_connection_cache => -1

[golden_negcache_garbage]
dsn => golden-pg
negative_connection_cache => foo

;-------------------------------------------------------------------
; slow_query_limit: sscanf %30d. WARN message says "must be a positive
; integer" but the code does NOT actually enforce positivity — only
; sscanf success. Locking that down: 0 and -1 should be accepted
; without WARN, "foo" should WARN.
;-------------------------------------------------------------------
[golden_slow_zero]
dsn => golden-pg
slow_query_limit => 0

[golden_slow_neg]
dsn => golden-pg
slow_query_limit => -1

[golden_slow_garbage]
dsn => golden-pg
slow_query_limit => foo

;-------------------------------------------------------------------
; Deprecated options — each emits the SAME generic WARN about being
; replaced by max_connections. The 'share*' check is a strncasecmp
; prefix match, so 'shared_connections', 'sharing', 'sharemyspace'
; all trigger.
;-------------------------------------------------------------------
[golden_deprecated_pooling]
dsn => golden-pg
pooling => yes

[golden_deprecated_share_exact]
dsn => golden-pg
share => yes

[golden_deprecated_share_prefix]
dsn => golden-pg
shared_connections => yes

[golden_deprecated_limit]
dsn => golden-pg
limit => 10

[golden_deprecated_idlecheck]
dsn => golden-pg
idlecheck => 60

;-------------------------------------------------------------------
; Bool-via-ast_true coverage: every bool field accepts y/yes/true/on/1
; equivalently, and the literal string "0" / "off" / "no" / "false"
; for false. ast_true returns 0 for unrecognized strings — which
; means typos like "ture" silently become "false". Document the quirk
; here so the migration consciously preserves or fixes it.
;-------------------------------------------------------------------
[golden_bool_yes_variants]
dsn => golden-pg
enabled => yes
pre-connect => true
forcecommit => 1
backslash_is_escape => y

[golden_bool_no_variants]
dsn => golden-pg
enabled => yes
pre-connect => no
forcecommit => 0
backslash_is_escape => false

[golden_bool_typos]
dsn => golden-pg
; "ture" / "yse" / "1.0" all silently → false via ast_true
pre-connect => ture
forcecommit => 1.0

;-------------------------------------------------------------------
; A second class on the same DSN — used to verify multi-class config
; doesn't cross-contaminate state between sections. Also exercises
; pre-connect=no.
;-------------------------------------------------------------------
[golden_secondary]
dsn => golden-pg
username => asterisk
password => asterisk
pre-connect => no
max_connections => 2
logging => no
isolation => serializable

;-------------------------------------------------------------------
; '=' vs '=>' equivalence. Asterisk's config lexer treats both
; identically for value assignment (only the var->object flag
; differs, which aco does not consult). This section uses '=' for
; every option and the snapshot must show identical parsed values
; to a section that uses '=>'.
;-------------------------------------------------------------------
[golden_eq_syntax]
dsn = golden-pg
username = asterisk
password = asterisk
pre-connect = yes
max_connections = 5
logging = yes
isolation = repeatable_read
cache_type = queue
cache_size = 25
forcecommit = yes
backslash_is_escape = no
connect_timeout = 7
negative_connection_cache = 1.5
slow_query_limit = 1234
sanitysql = SELECT 1

;-------------------------------------------------------------------
; Mixed '=' and '=>' in the same section. Identical to the section
; above semantically — parser accepts the mix.
;-------------------------------------------------------------------
[golden_mixed_syntax]
dsn => golden-pg
username = asterisk
password => asterisk
pre-connect = yes
max_connections => 5
logging = yes
isolation => repeatable_read
cache_type = queue
cache_size => 25
forcecommit = yes
backslash_is_escape => no
connect_timeout = 7
negative_connection_cache => 1.5
slow_query_limit = 1234
sanitysql => SELECT 1
