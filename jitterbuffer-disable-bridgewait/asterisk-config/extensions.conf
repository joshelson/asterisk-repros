[general]
static = yes
writeprotect = no

[globals]

; Reproduces the bug: JITTERBUFFER(disabled)= leaves a closed timer fd registered
; on the channel (AST_JITTERBUFFER_FD).  Any subsequent poll of that channel
; sees POLLNVAL from the closed fd and returns immediately, causing a tight loop
; at 100% CPU.  Two variants exercise different poll paths:
;
;   JB_WAIT_TYPE=wait        → Wait(5), polled by the dialplan thread's
;                              ast_waitfor() — UserEvent fires after the wait
;                              completes (or, in the buggy case, fails to fire
;                              in time because the spin slows everything down).
;
;   JB_WAIT_TYPE=bridgewait  → BridgeWait(default,participant,e(h)), matching
;                              the exact dialplan from the upstream issue.
;                              The "e(h)" idle mode (HOLD) drives a frame
;                              through the channel's framehooks, which fires
;                              the deferred destroy of the JB framehook and
;                              closes the timer fd → spin starts in whichever
;                              bridge-channel thread services this channel.
;                              UserEvent fires BEFORE BridgeWait (since the
;                              channel sits in the bridge until killed) so the
;                              loadgen knows the call reached the spin point.
;
; JB_TYPE = adaptive | fixed — both exercise the same disabled path.
[jb-bug-loop]
exten => s,1,Answer()
 same => n,Set(JB_TYPE=${IF($["${JB_TYPE}"=""]?adaptive:${JB_TYPE})})
 same => n,Set(JB_WAIT_TYPE=${IF($["${JB_WAIT_TYPE}"=""]?wait:${JB_WAIT_TYPE})})
 same => n,Set(JITTERBUFFER(${JB_TYPE})=default)
 same => n,Wait(1)
 same => n,Set(JITTERBUFFER(disabled)=)
 same => n,GotoIf($["${JB_WAIT_TYPE}"="bridgewait"]?do_bw:do_w)
 same => n(do_w),Wait(5)
 same => n,UserEvent(repro_result,status: SUCCESS)
 same => n,Hangup()
 same => n(do_bw),UserEvent(repro_result,status: SUCCESS)
 same => n,BridgeWait(default,participant,e(h))
 same => n,Hangup()
