[settings]
; Map the rt_test table to the asterisk-pg ODBC class.
; This routes ${REALTIME(rt_test,id,...)} through res_config_odbc, which
; uses ast_odbc_request_obj() to get a connection from res_odbc — the same
; code path PJSIP realtime uses for ps_endpoints/ps_auths/ps_aors.
rt_test => odbc,asterisk-pg,rt_test
