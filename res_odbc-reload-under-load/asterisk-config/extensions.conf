[general]
static = yes
writeprotect = no

[globals]

; Run an ODBC query in a tight loop and emit a UserEvent per
; iteration. We classify each iteration based on the actual returned
; value rather than ODBCSTATUS, because func_odbc does not always
; reset ODBCSTATUS on failure paths (e.g. when ast_odbc_request_obj
; returns NULL — "Unable to execute query" — the variable retains
; its previous value).
[odbc-loop]
exten => s,1,NoOp(start)
 same => n,Set(__N=${IF($["${N}"=""]?100:${N})})
 same => n,Set(I=0)
 same => n,While($[${I} < ${N}])
 same => n,Set(KEY=alice)
 same => n,Set(RES=${ODBC_LOOKUP(${KEY})})
 same => n,GotoIf($["${RES}" = "a-result"]?ok:bad)
 same => n(bad),Set(STATUS=FAIL_${IF($["${RES}"=""]?EMPTY:WRONG)})
 same => n,Goto(emit)
 same => n(ok),Set(STATUS=SUCCESS)
 same => n(emit),UserEvent(odbc_result,key: ${KEY},value: ${RES},status: ${STATUS})
 same => n,Set(I=$[${I}+1])
 same => n,EndWhile
 same => n,Hangup()

; Same shape as odbc-loop but uses ${REALTIME()} instead of ODBC_LOOKUP.
; REALTIME goes through res_config_odbc -> ast_odbc_request_obj -> the
; same odbc_class_find path that PJSIP realtime uses for ps_endpoints
; etc. This lets us verify the patches keep the realtime lookup path
; working across reloads.
[realtime-loop]
exten => s,1,NoOp(start)
 same => n,Set(__N=${IF($["${N}"=""]?100:${N})})
 same => n,Set(I=0)
 same => n,While($[${I} < ${N}])
 same => n,Set(KEY=e1)
 same => n,Set(RES=${REALTIME_FIELD(rt_test,id,${KEY},value)})
 same => n,GotoIf($["${RES}" = "rt-value-1"]?ok:bad)
 same => n(bad),Set(STATUS=FAIL_${IF($["${RES}"=""]?EMPTY:WRONG)})
 same => n,Goto(emit)
 same => n(ok),Set(STATUS=SUCCESS)
 same => n(emit),UserEvent(odbc_result,key: ${KEY},value: ${RES},status: ${STATUS})
 same => n,Set(I=$[${I}+1])
 same => n,EndWhile
 same => n,Hangup()
