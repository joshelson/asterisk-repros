[general]
dateformat = %F %T
; The buggy baseline runs produce hundreds of WARNINGs per second
; ("Error SQLConnect ... too many clients already") during the
; reload-induced connection storm. Default queue size (100) overflows
; and asterisk drops messages, sometimes destabilising the process.
; Raise the queue so the reproducer's log is faithful and asterisk
; stays up across the storm.
queue_size = 100000

[logfiles]
; Send only NOTICE/WARNING/ERROR. Verbose dialplan tracing during the
; load test produces hundreds of MB of log per minute and kills the
; container (and by extension asterisk).
console => notice,warning,error
messages => notice,warning,error
full => notice,warning,error
