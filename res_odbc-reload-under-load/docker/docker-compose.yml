services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: asterisk
      POSTGRES_USER: asterisk
      POSTGRES_PASSWORD: asterisk
    # Tight connection cap so connection storms cause real failures.
    command:
      - "postgres"
      - "-c"
      - "max_connections=15"
      - "-c"
      - "log_connections=on"
      - "-c"
      - "log_disconnections=on"
    volumes:
      - ../sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asterisk -d asterisk"]
      interval: 1s
      timeout: 1s
      retries: 30

  asterisk:
    build:
      context: .
      dockerfile: Dockerfile.asterisk
    depends_on:
      db:
        condition: service_healthy
    # Mount the asterisk source tree so we can swap patches in/out and
    # rebuild affected modules between runs without rebuilding the image.
    # Override ASTERISK_SRC if your asterisk checkout isn't at the
    # default sibling-of-this-repo location.
    volumes:
      - ${ASTERISK_SRC:-../../../asterisk}:/asterisk-src:rw
      - ../asterisk-config:/etc/asterisk:rw
      - ../loadgen:/loadgen:ro
      - ../sql:/sql:ro
      - ../scripts:/scripts:ro
    working_dir: /asterisk-src
    tty: true
    stdin_open: true
    # Keep the container alive so we can `docker exec` into it for
    # build/test/measure cycles.
    command: ["sleep", "infinity"]
