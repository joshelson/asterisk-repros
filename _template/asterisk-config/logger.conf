[general]
dateformat = %F %T
; Buggy reproducers can produce hundreds of WARNINGs per second during
; a storm. Default queue size (100) overflows and can destabilise
; asterisk; raise the queue so the harness's log is faithful and
; asterisk stays up.
queue_size = 100000

[logfiles]
console => notice,warning,error
messages => notice,warning,error
full => notice,warning,error
