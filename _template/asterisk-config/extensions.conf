[general]
static = yes
writeprotect = no

[globals]

; A skeleton dialplan context that emits a UserEvent per iteration.
; The loadgen counts these events to compute success/failure rates.
;
; Replace the body of this loop with the operation that exercises
; your bug. Set STATUS to "SUCCESS" if the operation succeeded, or
; some "FAIL_*" string if it didn't — the loadgen treats anything
; other than SUCCESS as a failure.
[__REPRO_NAME__-loop]
exten => s,1,NoOp(start)
 same => n,Set(__N=${IF($["${N}"=""]?100:${N})})
 same => n,Set(I=0)
 same => n,While($[${I} < ${N}])
 ; --- begin: the operation under test ---
 same => n,Set(STATUS=SUCCESS)
 ; --- end: the operation under test ---
 same => n,UserEvent(repro_result,status: ${STATUS})
 same => n,Set(I=$[${I}+1])
 same => n,EndWhile
 same => n,Hangup()
